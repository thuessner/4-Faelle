.mode span{font-size:1.15rem;display:block}

.chip{display:inline-block;padding:.1rem .8rem;margin:.15rem .25rem .15rem 0;border-radius:1rem;border:2px solid var(--c,var(--bark));background:var(--cb,#fff);font-weight:700;font-size:1.1rem}
.sentence,.sentence2{font-size:2rem;line-height:2.4;padding:.6rem 0}
.sentence2{display:flex;flex-wrap:wrap;align-items:center;gap:.3rem .6rem}
.wd{font:inherit;background:none;border:0;border-bottom:.4rem solid transparent;border-radius:.5rem .5rem 0 0;padding:0 .25rem;margin:0 .05rem;color:inherit}

.tr{display:grid;grid-template-columns:12rem 1fr 1fr;gap:.8rem;align-items:center;margin-bottom:.6rem;padding:.4rem .6rem;border-radius:1rem;background:var(--cb);border-left:.6rem solid var(--c)}

.in3,.given3{width:100%}
.given3{font-size:1.7rem;font-weight:700;padding:.3rem 1rem}

.bt.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.bt.no{background:var(--badbg);border-color:var(--bad);color:var(--bad)}

.hd{text-align:center;color:var(--bark);font-size:1.15rem}
.cell{min-height:3.5rem;display:flex;align-items:center;justify-content:center;padding:.2rem .6rem;border-radius:.9rem;border:3px solid var(--bark);text-align:center;font-weight:700}

.say{display:flex;gap:.9rem;align-items:center;margin:.4rem 0 1rem}

</style>
</head>

["Der Lehrer hilft ___ Schüler.","dem",3],["Die Kinder danken ___ Lehrer.","dem",3],["Das Auto ___ Lehrers ist neu.","des",2],
["Jojo gibt ___ Frosch ein Blatt.","dem",3],["Jojo füttert ___ Frosch.","den",4],["Das Ei ___ Vogels liegt im Nest.","des",2],
["Mia streichelt ___ Hund.","den",4],["Jojo hilft ___ Kindern.","den",3],["Der Hund folgt ___ Kindern.","den",3],
["Das Spielzeug ___ Kindes liegt dort.","des",2],["Der Hirte hilft ___ Schaf.","dem",3],["Der Opa liest ___ Enkel ein Buch vor.","dem",3],
["Die Mutter ruft ___ Sohn.","den",4],["Das Zimmer ___ Mädchens ist bunt.","des",2],["Jojo gibt ___ Mädchen ein Blatt.","dem",3],
["Der Bär frisst ___ Fisch.","den",4],["Die Katze gehört ___ Nachbarn.","dem",3],["Das Bellen ___ Hundes ist laut.","des",2],
["Jojo hilft ___ Vogel.","dem",3],["Mia sucht ___ Ball.","den",4],["Der Hund gehört ___ Mädchen.","dem",3],
["Die Farbe ___ Autos ist rot.","des",2],["Jojo dankt ___ Arzt.","dem",3],["Der Löwe jagt ___ Affen.","den",4],
["Das Haus ___ Lehrers ist klein.","des",2],["Die Kinder folgen ___ Lehrer.","dem",3],["Mia füttert ___ Hasen.","den",4]
];
// Spiel 5
const TL=[null,["1. Fall","Nominativ","Wer oder was?"],["2. Fall","Genitiv","Wessen?"],["3. Fall","Dativ","Wem?"],["4. Fall","Akkusativ","Wen oder was?"]];

/* ---------- Ablauf ---------- */
const POOL={1:S1,2:S2,3:N3,4:S4},SEEN={1:new Set(),2:new Set(),3:new Set(),4:new Set()};
let st={};
const head=x=>`Aufgabe ${st.i+1} von ${st.n}: ${x}`;
function leaves(){$("dots").innerHTML=Array.from({length:st.n},(_,k)=>`<span class="leaf ${k<st.res.length?(st.res[k]?'star':'done'):k===st.i?'now':''}"></span>`).join("")}
function msg(t,k){$("fb").textContent=t;$("fb").className="fb "+(k||"")}
function shake(el){el.classList.remove("shake");void el.offsetWidth;el.classList.add("shake")}
function show(id){["menu","play","end"].forEach(s=>$(s).hidden=s!==id);window.scrollTo(0,0)}
function start(m){
  st={m:m,i:0,n:m===3?5:m===5?3:10,res:[],stars:0};
  st.items=m===5?null:pickN(POOL[m],SEEN[m],st.n);
  show("play");load();
}
function load(){
  st.tries=0;st.done=false;
  ["chk","tip","sol","nxt"].forEach(b=>$(b).hidden=true);
  $("nxt").textContent=st.i===st.n-1?"Fertig ›":"Weiter ›";
  msg("Los geht’s! Jojo schaut dir gemütlich zu.");
  [0,load1,load2,load3,load4,load5][st.m]();leaves();
}
function done(star,text){
  st.done=true;st.res.push(star);if(star)st.stars++;
  msg(text,"good");["chk","tip","sol"].forEach(b=>$(b).hidden=true);$("nxt").hidden=false;leaves();
}
function wrongFb(text){st.tries++;msg(text,"nope");shake($("stage"));if(st.tries>=2)$("sol").hidden=false}

/* Spiel 1: Satzglied unterstreichen */
const cap=c=>`${CASES[c].n} (${CASES[c].o})`;
const ATTR='type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"';
function parse(str){
  const segs=[],words=[];let last=0,sid=0,m;const re=/\{(\d)\|([^}]+)\}/g;
  const plain=t=>t.split(" ").filter(Boolean).forEach(w=>{const q=w.match(/^(.*?)([.,!?]*)$/);
    if(q[1]===""&&words.length)words[words.length-1].p+=q[2];else words.push({w:q[1],p:q[2],s:-1})});
  while((m=re.exec(str))){plain(str.slice(last,m.index));segs.push({c:+m[1],t:m[2]});m[2].split(" ").forEach(w=>words.push({w:w,p:"",s:sid}));sid++;last=re.lastIndex}
  plain(str.slice(last));return {words:words,segs:segs};
}
function load1(){
  const s=parse(st.items[st.i]),k=rnd(0,s.segs.length-1),c=s.segs[k].c;
  st.cur={s:s,k:k,c:c};st.sel=new Set();
  $("q").innerHTML=head(`Unterstreiche das ganze Satzglied im <b>${cap(c)}</b>.`);
  $("stage").innerHTML=`<div class="sentence k${c}" id="sentence">${s.words.map((o,i)=>`<button class="wd" data-i="${i}">${o.w}</button>${o.p}`).join(" ")}</div><div id="sum"></div>`;
  $("chk").hidden=false;$("tip").hidden=false;
}
function chk1(){
  const c=st.cur,tg=new Set();c.s.words.forEach((w,i)=>{if(w.s===c.k)tg.add(i)});
  if(!st.sel.size){msg("Tippe zuerst auf die Wörter, die du unterstreichen willst.");return}
  const miss=[...tg].some(i=>!st.sel.has(i)),extra=[...st.sel].some(i=>!tg.has(i));
  if(!miss&&!extra)return fin1(st.tries===0,"Richtig!");
  wrongFb(miss&&!extra?"Fast! Es fehlt noch ein Wort, das zum Satzglied gehört.":extra&&!miss?"Fast! Ein unterstrichenes Wort gehört nicht zum Satzglied.":`Noch nicht. Stelle die Frage „${CASES[c.c].q}“ und frage nach dem ganzen Satzglied.`);
}
function fin1(star,pre){
  const c=st.cur;
  document.querySelectorAll(".wd").forEach(b=>{const w=c.s.words[+b.dataset.i];b.disabled=true;b.classList.remove("sel");if(w.s>=0)b.classList.add("u"+c.s.segs[w.s].c);if(w.s===c.k)b.classList.add("tg")});
  $("sum").innerHTML=c.s.segs.map(g=>`<span class="chip k${g.c}">${CASES[g.c].n} (${CASES[g.c].q}): ${g.t}</span>`).join(" ");
  done(star,`${pre} „${c.s.segs[c.k].t}“ steht im ${CASES[c.c].n}. Frage: ${CASES[c.c].q}`);
}

/* Spiel 2: Satzglied einsetzen */
function load2(){
  const [txt,nom,c,ans,alt]=st.items[st.i],p=txt.split("___");st.cur={c:c,ans:ans,alts:alt||[]};
  $("q").innerHTML=head(`Setze das Nomen im <b>${cap(c)}</b> in die Lücke.`);
  $("stage").innerHTML=`<div class="sentence2 k${c}"><span>${p[0]}</span><input id="in2" ${ATTR} enterkeyhint="done" aria-label="Satzglied"><span>${p[1]}</span></div><div class="k${c}"><span class="chip" style="--c:var(--bark);--cb:var(--furbg)">Nomen: ${nom}</span><span class="chip">${cap(c)}</span></div>`;
  $("in2").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();chk2()}});
  $("chk").hidden=false;$("tip").hidden=false;
}
function fill2(){const i=$("in2");i.readOnly=true;i.className="ok";i.value=st.cur.ans}
function chk2(){
  if(st.done)return;const c=st.cur,v=norm($("in2").value);
  if(!v){msg("Schreibe zuerst etwas in die Lücke.");return}
  if([c.ans,...c.alts].map(norm).includes(v)){fill2();done(st.tries===0,`Richtig! ${CASES[c.c].n} (${CASES[c.c].q}): ${c.ans}.`)}
  else wrongFb(v.split(" ")[0]===norm(c.ans).split(" ")[0]?"Der Artikel stimmt. Prüfe noch die Endungen.":`Noch nicht. Welcher Artikel gehört in den ${CASES[c.c].n}?`);
}

/* Spiel 3: Fälle-Tabelle (Einzahl und Mehrzahl, nur bestimmte Artikel) */
function load3(){
  const n=st.items[st.i],rows=[1,2,3,4].map(r=>({s:n[r-1],p:[n[4],n[5],n[6],n[4]][r-1],alt:r===2&&n[7]?[n[7]]:[]}));
  st.cur={rows:rows};
  $("q").innerHTML=head(`Schreibe „<b>${rows[0].s}</b>“ und „<b>${rows[0].p}</b>“ in alle Fälle. Der Nominativ ist schon da.`);
  let h='<div class="tr th"><span></span><b>Einzahl</b><b>Mehrzahl</b></div>';
  [1,2,3,4].forEach(r=>{const x=rows[r-1];
    h+=`<div class="tr k${r}"><div class="lab"><b>${CASES[r].n}</b><small>${CASES[r].q}</small></div>`+(r===1?`<div class="given3">${x.s}</div><div class="given3">${x.p}</div>`:`<input class="in3" id="i3${r}s" ${ATTR} aria-label="${CASES[r].n} Einzahl"><input class="in3" id="i3${r}p" ${ATTR} aria-label="${CASES[r].n} Mehrzahl">`)+"</div>"});
  $("stage").innerHTML=h;
  const ins=[...$("stage").querySelectorAll(".in3")];
  ins.forEach((i,k)=>i.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();ins[k+1]?ins[k+1].focus():chk3()}}));
  $("chk").hidden=false;
}
function chk3(){
  if(st.done)return;let all=true;
  for(let r=2;r<=4;r++)["s","p"].forEach(k=>{
    const i=$("i3"+r+k),g=st.cur.rows[r-1],goods=k==="s"?[g.s,...g.alt]:[g.p];
    if(goods.map(norm).includes(norm(i.value))){i.readOnly=true;i.className="in3 ok"}else{all=false;i.className="in3 bad"}});
  if(all)done(st.tries===0,"Richtig! Alle Fälle in Einzahl und Mehrzahl stimmen.");
  else wrongFb("Die roten Felder stimmen noch nicht. Stelle dir die Fragen: Wessen? Wem? Wen oder was?");
}
$("stage").addEventListener("input",e=>{if(e.target.classList.contains("in3"))e.target.classList.remove("bad")});

/* Spiel 4: dem, den oder des */
function load4(){
  const [txt,ans,c]=st.items[st.i],p=txt.split("___");st.cur={ans:ans,c:c};
  $("q").innerHTML=head("Welcher Artikel passt in die Lücke?");
  $("stage").innerHTML=`<div class="sentence2"><span>${p[0]}</span><span class="gap" id="gap4">&nbsp;</span><span>${p[1]}</span></div><div class="row">${["dem","den","des"].map(w=>`<button class="btn bt" data-w="${w}">${w}</button>`).join("")}</div>`;
  $("tip").hidden=false;
}
function answer4(b){
  const c=st.cur;if(b.disabled)return;
  if(b.dataset.w===c.ans){
    b.classList.add("ok");document.querySelectorAll(".bt").forEach(x=>x.disabled=true);$("gap4").textContent=c.ans;$("gap4").className="gap ok k"+c.c;
    done(st.tries===0,`Richtig! Frage: „${CASES[c.c].q}“ – das ist der ${CASES[c.c].n}. Darum: ${c.ans}.`);
  }else{b.classList.add("no");b.disabled=true;
    wrongFb(st.tries===0?"Noch nicht. Welche Frage passt: Wessen? Wem? oder Wen?":`Noch nicht. Hier fragst du „${CASES[c.c].q}“.`)}
}

/* Spiel 5: ziehen */
function load5(){
  const tiles=[];let h='<div class="dt"><b class="hd">Fall</b><b class="hd">Name</b><b class="hd">Frage</b>';
  shuffle([1,2,3,4]).forEach(r=>{const pc=rnd(0,2);for(let c=0;c<3;c++){const v=TL[r][c];
    if(c===pc)h+=`<div class="cell pre k${r}" data-k="${r}">${v}</div>`;else{h+=`<div class="cell empty k${r}" data-v="${v}" data-k="${r}"></div>`;tiles.push(v)}}});
  h+='</div><div class="pool" id="pool">'+shuffle(tiles).map(v=>`<div class="tile" data-v="${v}">${v}</div>`).join("")+"</div>";
  st.left=tiles.length;st.mist=0;st.pick=null;
  $("q").innerHTML=head("Ziehe jede Karte in das richtige Feld. Du kannst auch erst die Karte und dann das Feld antippen.");
  $("stage").innerHTML=h;
}
function clearPick(){if(st.pick)st.pick.classList.remove("pick");st.pick=null}
function drop(t,c){
  if(t.dataset.v===c.dataset.v){
    c.textContent=t.dataset.v;c.className="cell ok k"+c.dataset.k;t.remove();clearPick();
    if(--st.left===0)done(st.mist===0,"Super! Alle Karten sitzen richtig.");
  }else{st.mist++;shake(c);clearPick();msg("Das passt nicht in dieses Feld. Lies die Zeile noch einmal.","nope");if(st.mist>=3)$("sol").hidden=false}
}
let drag=null;
$("stage").addEventListener("pointerdown",e=>{
  const t=e.target.closest(".tile");if(!t||st.done)return;e.preventDefault();
  drag={t:t,x:e.clientX,y:e.clientY,g:null};t.setPointerCapture(e.pointerId);
});
addEventListener("pointermove",e=>{
  if(!drag)return;
  if(!drag.g&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8){
    const r=drag.t.getBoundingClientRect(),g=drag.t.cloneNode(true);g.classList.add("ghost");g.style.width=r.width+"px";document.body.appendChild(g);
    drag.g=g;drag.ox=e.clientX-r.left;drag.oy=e.clientY-r.top;drag.t.classList.add("lift");
  }
  if(drag.g){drag.g.style.left=(e.clientX-drag.ox)+"px";drag.g.style.top=(e.clientY-drag.oy)+"px"}
});
function endDrag(e,cancel){
  if(!drag)return;const d=drag;drag=null;
  if(d.g){d.g.remove();d.t.classList.remove("lift");
    if(!cancel){const el=document.elementFromPoint(e.clientX,e.clientY),c=el&&el.closest(".cell.empty");if(c)drop(d.t,c)}}
  else if(!cancel){if(st.pick===d.t)clearPick();else{clearPick();st.pick=d.t;d.t.classList.add("pick")}}
}
addEventListener("pointerup",e=>endDrag(e,false));
addEventListener("pointercancel",e=>endDrag(e,true));

/* gemeinsame Klicks */
$("stage").addEventListener("click",e=>{
  if(st.done)return;
  if(st.m===1){const b=e.target.closest(".wd");if(b){const i=+b.dataset.i;b.classList.toggle("sel");st.sel.has(i)?st.sel.delete(i):st.sel.add(i)}}
  else if(st.m===4){const b=e.target.closest(".bt");if(b)answer4(b)}
  else if(st.m===5){const c=e.target.closest(".cell.empty");if(c&&st.pick)drop(st.pick,c)}
});
$("chk").onclick=()=>[0,chk1,chk2,chk3][st.m]();
$("tip").onclick=()=>{
  const c=st.cur;
  msg(st.m===4?"Tipp: Frage nach dem Nomen. Wessen … ? → des. Wem … ? → dem. Wen … ? → den.":`Tipp: Die Frage lautet „${CASES[c.c].q}“`);
};
$("sol").onclick=()=>{
  const c=st.cur;if(st.done)return;
  if(st.m===1){st.sel=new Set(c.s.words.map((w,i)=>w.s===c.k?i:-1).filter(i=>i>=0));fin1(false,"Lösung:")}
  else if(st.m===2){fill2();done(false,`Lösung: ${c.ans}.`)}
  else if(st.m===3){for(let r=2;r<=4;r++){const g=c.rows[r-1];[["s",g.s],["p",g.p]].forEach(([k,v])=>{const i=$("i3"+r+k);i.value=v;i.className="in3 ok";i.readOnly=true})}done(false,"Lösung: So sehen alle Fälle in Einzahl und Mehrzahl aus.")}
  else if(st.m===4){document.querySelectorAll(".bt").forEach(x=>{x.disabled=true;if(x.dataset.w===c.ans)x.classList.add("ok")});$("gap4").textContent=c.ans;$("gap4").className="gap ok k"+c.c;done(false,`Lösung: ${c.ans}. Hier fragst du „${CASES[c.c].q}“ – das ist der ${CASES[c.c].n}.`)}
  else{document.querySelectorAll(".cell.empty").forEach(x=>{x.textContent=x.dataset.v;x.className="cell ok k"+x.dataset.k});document.querySelectorAll(".tile").forEach(x=>x.remove());clearPick();done(false,"Lösung: So gehören die Karten zusammen.")}
};
$("nxt").onclick=()=>{
  if(st.i<st.n-1){st.i++;load();return}
  const k=Math.round(st.stars/st.n*5);
  $("stars").textContent="★".repeat(k)+"☆".repeat(5-k);
  $("score").textContent=`${st.stars} von ${st.n} Aufgaben hast du gleich beim ersten Versuch richtig gelöst.`;
  show("end");
};
document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>start(+b.dataset.m));
$("back").onclick=$("home").onclick=()=>show("menu");
$("again").onclick=()=>start(st.m);
</script>
